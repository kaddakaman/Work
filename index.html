<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Asset readings, hours worked, vacuum hoses and sentry log — all on your phone, offline." />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Work Mate" />
    <title>Work Mate</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 id="page-title">Work Mate</h1>
    </header>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <noscript><p style="padding: 16px">Work Mate needs JavaScript turned on.</p></noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
